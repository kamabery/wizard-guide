<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Wizard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f7f7f5, #1b1b1a);
    --surface: light-dark(#ffffff, #262625);
    --text: light-dark(#1f1f1e, #ececea);
    --muted: light-dark(#5f5f5b, #a9a9a4);
    --border: light-dark(#dcdcd7, #40403d);
    --accent: light-dark(#1f5fbf, #7fb0f5);
    --code-bg: light-dark(#f0f0ec, #181817);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  #summary { color: var(--muted); }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-top: 16px; }
  ol.steps { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 16px 0 0; }
  ol.steps li { border: 1px solid var(--border); border-radius: 999px; padding: 2px 12px; font-size: .85rem; color: var(--muted); }
  ol.steps li.now { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.4 Consolas, monospace; }
  code { font-family: Consolas, monospace; overflow-wrap: anywhere; }
  button { font: inherit; font-size: .9rem; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 6px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
  a { color: var(--accent); overflow-wrap: anywhere; }
  .action { margin-bottom: 14px; }
  .action:last-child { margin-bottom: 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); }
  .row:first-of-type { border-top: 0; }
  .note { border-left: 3px solid var(--accent); padding-left: 12px; margin: 0; }
</style>
</head>
<body>
<main id="app"><h1>Wizard</h1><p>Loading…</p></main>
<script src="wizard-data.js"></script>
<script>
  // Everything from the data file goes in through textContent, so a command can hold any characters.
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // The only formatting: **bold** and `code`.
  function rich(tag, text, className) {
    const node = el(tag, className);
    String(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(part => {
      if (part.startsWith('**') && part.endsWith('**') && part.length > 4) node.append(el('strong', '', part.slice(2, -2)));
      else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) node.append(el('code', '', part.slice(1, -1)));
      else if (part) node.append(part);
    });
    return node;
  }

  // A page opened from disk may have no clipboard API, so fall back to the older copy command.
  async function writeClipboard(text) {
    if (navigator.clipboard) {
      try { await navigator.clipboard.writeText(text); return true; } catch { /* use the fallback */ }
    }
    const area = el('textarea');
    area.value = text;
    document.body.append(area);
    area.select();
    const copied = document.execCommand('copy');
    area.remove();
    return copied;
  }

  function copyButton(label, text) {
    const button = el('button', '', label);
    button.type = 'button';
    button.addEventListener('click', async () => {
      button.textContent = await writeClipboard(text) ? 'Copied' : 'Copy failed';
      setTimeout(() => { button.textContent = label; }, 1500);
    });
    return button;
  }

  function render(w) {
    const app = document.getElementById('app');
    app.replaceChildren();
    const title = w.title || 'Wizard';
    document.title = title;
    app.append(el('h1', '', title));

    const steps = w.steps || [];
    const finished = steps.length > 0 && w.current > steps.length;
    if (steps.length) {
      const position = finished ? 'Finished' : `Step ${w.current} of ${steps.length}`;
      app.append(el('p', '', position));
    }
    if (w.summary) { const s = rich('p', w.summary); s.id = 'summary'; app.append(s); }

    if (steps.length) {
      const list = el('ol', 'steps');
      steps.forEach((name, i) => {
        const n = i + 1;
        const li = el('li', n === w.current ? 'now' : '', `${n} ${name}${n < w.current ? ' ✓' : ''}`);
        if (n === w.current) li.setAttribute('aria-current', 'step');
        list.append(li);
      });
      app.append(list);
    }

    if (w.why) {
      const section = el('section');
      section.append(el('h2', '', "Why you're doing this"), rich('p', w.why));
      app.append(section);
    }

    if (w.actions && w.actions.length) {
      const section = el('section');
      section.append(el('h2', '', w.heading || 'Do this'));
      w.actions.forEach(action => {
        const block = el('div', 'action');
        if (action.copy !== undefined) {
          const row = el('div', 'row');
          const label = rich('div', action.text || '');
          label.append(' ', el('code', '', action.copy));
          row.append(label, copyButton('Copy', action.copy));
          block.append(row);
        } else if (action.text) {
          block.append(rich('p', action.text));
        }
        if (action.url) {
          const link = el('a', '', action.url);
          link.href = action.url;
          link.target = '_blank';
          link.rel = 'noreferrer';
          block.append(link);
        }
        if (action.command) {
          block.append(el('pre', '', action.command), copyButton('Copy command', action.command));
        }
        section.append(block);
      });
      app.append(section);
    }

    if (w.note) {
      const section = el('section');
      section.append(rich('p', w.note, 'note'));
      app.append(section);
    }

    if (w.replies && w.replies.length) {
      const section = el('section');
      section.append(el('h2', '', 'Reply in chat'));
      if (w.replyIntro) section.append(rich('p', w.replyIntro));
      w.replies.forEach(reply => {
        const row = el('div', 'row');
        const text = rich('div', reply.text);
        text.prepend(el('strong', '', reply.key), ': ');
        row.append(text, copyButton(`Copy ${reply.key}`, reply.key));
        section.append(row);
      });
      app.append(section);
    }
  }

  if (window.WIZARD) {
    render(window.WIZARD);
  } else {
    document.getElementById('app').replaceChildren(
      el('h1', '', 'Wizard'),
      el('p', '', 'wizard-data.js is missing or has an error. Ask Claude to write it again, then refresh.'));
  }
</script>
</body>
</html>
